<div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/50 p-4" (click)="closed.emit()">
  <div class="flex max-h-[80vh] w-full max-w-2xl flex-col rounded-xl bg-white shadow-2xl dark:bg-slate-800" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-3.5 dark:border-slate-700">
      <div>
        <h2 class="text-base font-semibold text-slate-800 dark:text-slate-100">新しい図を作成</h2>
        <p class="mt-0.5 text-xs text-slate-400">テンプレートを選択してください（既存の図は破棄されます）</p>
      </div>
      <button
        class="flex h-7 w-7 items-center justify-center rounded-md text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700"
        (click)="closed.emit()"
        title="閉じる"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6 6 18" /><path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <div class="as-scroll grid flex-1 grid-cols-1 gap-3 overflow-y-auto p-5 sm:grid-cols-2">
      @for (template of templates; track template.id) {
        <button
          class="rounded-xl border border-slate-200 p-4 text-left transition-colors hover:border-indigo-400 hover:bg-indigo-50/50 dark:border-slate-600 dark:hover:border-indigo-500 dark:hover:bg-slate-700/40"
          (click)="select(template)"
        >
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-slate-800 dark:text-slate-100">{{ template.title }}</span>
            <span class="rounded-full bg-indigo-100 px-2 py-0.5 text-[10px] font-medium text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300">
              {{ template.category }}
            </span>
          </div>
          <p class="mt-1.5 text-xs leading-relaxed text-slate-500 dark:text-slate-400">{{ template.description }}</p>
        </button>
      }
    </div>
  </div>
</div>
