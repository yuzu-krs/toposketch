<div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/50 p-4" (click)="closed.emit()">
  <div class="flex max-h-[70vh] w-full max-w-lg flex-col rounded-xl bg-white shadow-2xl dark:bg-slate-800" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-3.5 dark:border-slate-700">
      <h2 class="text-base font-semibold text-slate-800 dark:text-slate-100">図を開く</h2>
      <div class="flex items-center gap-2">
        <button
          class="rounded-md px-2 py-1 text-xs text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700"
          (click)="refresh()"
          [disabled]="loading()"
        >
          再読み込み
        </button>
        <button
          class="flex h-7 w-7 items-center justify-center rounded-md text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700"
          (click)="closed.emit()"
          title="閉じる"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6 6 18" /><path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
    </div>

    <div class="as-scroll flex-1 overflow-y-auto p-3">
      @if (loading()) {
        <div class="flex items-center justify-center py-10 text-sm text-slate-400">読み込み中…</div>
      } @else if (error()) {
        <div class="rounded-lg bg-red-50 p-4 text-sm text-red-600 dark:bg-red-500/10 dark:text-red-400">
          {{ error() }}
        </div>
      } @else if (diagrams().length === 0) {
        <div class="py-10 text-center text-sm text-slate-400">保存された図はまだありません</div>
      } @else {
        <ul class="space-y-1">
          @for (diagram of diagrams(); track diagram.id) {
            <li class="group flex items-center gap-3 rounded-lg px-3 py-2.5 hover:bg-indigo-50 dark:hover:bg-slate-700/60">
              <button class="min-w-0 flex-1 text-left" (click)="open(diagram.id)">
                <p class="truncate text-sm font-medium text-slate-800 dark:text-slate-100">{{ diagram.name }}</p>
                <p class="mt-0.5 text-xs text-slate-400">更新: {{ formatDate(diagram.updatedAtUtc) }}</p>
              </button>
              <button
                class="shrink-0 rounded-md px-2 py-1 text-xs text-slate-400 opacity-0 transition-opacity hover:bg-red-50 hover:text-red-500 focus:opacity-100 group-hover:opacity-100 dark:hover:bg-red-500/10"
                [disabled]="deleting().has(diagram.id)"
                (click)="remove(diagram.id, diagram.name)"
              >
                削除
              </button>
            </li>
          }
        </ul>
      }
    </div>
  </div>
</div>
