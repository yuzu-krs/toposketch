<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ArchSketch</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="技術アーキテクチャ図を作成・編集・保存できるWebアプリ">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // FOUC を防ぐため、レンダリング前にテーマを確定させる
    try {
      var t = localStorage.getItem('archsketch.theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) { /* ignore */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
